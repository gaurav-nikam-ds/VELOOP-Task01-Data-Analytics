name: Vercel app build check

on:
  push:
    branches: [main]
    paths:
      - "vercel-app/**"
      - ".github/workflows/vercel-app-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "vercel-app/**"
      - ".github/workflows/vercel-app-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vercel-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vercel-app/package.json
      - name: Install dependencies
        run: npm install
      - name: Build Next.js app
        run: npm run build
